<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ZU-IZU Bush Pilot Programme</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark only; font-size: 16px; }

:root {
  --navy:    #0d1b2a;
  --navy2:   #1a2e40;
  --navy3:   #243447;
  --navy4:   #2e3f52;
  --gold:    #c8960c;
  --gold2:   #e6b020;
  --gold3:   #f5d878;
  --goldfaint: rgba(200,150,12,0.13);
  --red:     #8b1a1a;
  --red2:    #c0392b;
  --redfaint: rgba(192,57,43,0.13);
  --green2:  #2d7a4a;
  --greenfaint: rgba(45,122,74,0.15);
  --text:    #e8e0cc;
  --text2:   #b0a888;
  --text3:   #7a7060;
  --border:  rgba(200,150,12,0.22);
  --radius:  10px;

  /* Fluid type scale */
  --fs-xs:   clamp(0.7rem,  1.5vw, 0.85rem);
  --fs-sm:   clamp(0.82rem, 1.8vw, 1rem);
  --fs-base: clamp(0.92rem, 2vw,   1.1rem);
  --fs-md:   clamp(1rem,    2.2vw, 1.2rem);
  --fs-lg:   clamp(1.1rem,  2.5vw, 1.4rem);
  --fs-xl:   clamp(1.3rem,  3vw,   1.7rem);
  --fs-2xl:  clamp(1.5rem,  3.5vw, 2rem);
}

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ────────────────────────────────────── */
header {
  background: linear-gradient(135deg, #080f18 0%, #1a2e40 100%);
  border-bottom: 2px solid var(--gold);
  padding: clamp(12px,2.5vw,20px) clamp(14px,3vw,28px);
  position: sticky; top: 0; z-index: 300;
}
.hdr-sub {
  font-size: var(--fs-xs);
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--gold); margin-bottom: 3px;
  font-family: 'Courier New', monospace;
}
.hdr-title {
  font-size: var(--fs-xl);
  color: var(--text); font-weight: normal; letter-spacing: 0.5px;
}
.hdr-reg {
  font-size: var(--fs-xs);
  color: var(--text2); margin-top: 3px;
  font-family: 'Courier New', monospace;
}

/* ── TABS ───────────────────────────────────────── */
.tabs {
  display: flex; background: #080f18;
  border-bottom: 1px solid var(--border);
  position: sticky; top: clamp(62px,10vw,88px); z-index: 200;
}
.tab {
  flex: 1; padding: clamp(9px,2vw,14px) 4px;
  text-align: center;
  font-size: var(--fs-xs);
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  font-family: 'Courier New', monospace;
}
.tab.active { color: var(--gold2); border-bottom-color: var(--gold); background: var(--goldfaint); }

/* ── PROGRESS ───────────────────────────────────── */
.progress-wrap {
  background: var(--navy2); padding: 8px clamp(14px,3vw,28px);
  border-bottom: 1px solid var(--border);
}
.progress-label {
  display: flex; justify-content: space-between;
  font-size: var(--fs-xs); color: var(--text2); margin-bottom: 5px;
  font-family: 'Courier New', monospace;
}
.progress-bar {
  background: #080f18; border: 1px solid var(--border);
  border-radius: 20px; height: 7px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 20px;
  background: linear-gradient(90deg, var(--gold), var(--gold3));
  transition: width 0.5s ease;
}

/* ── MODULE PICKER ──────────────────────────────── */
.mod-picker {
  display: flex; overflow-x: auto; gap: 7px;
  padding: 10px clamp(14px,3vw,28px);
  background: var(--navy2); border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.mod-picker::-webkit-scrollbar { display: none; }
.mod-pill {
  flex-shrink: 0; padding: clamp(6px,1.2vw,9px) clamp(12px,2vw,18px);
  border-radius: 20px; font-size: var(--fs-sm);
  cursor: pointer; border: 1px solid var(--border);
  background: var(--navy3); color: var(--text2);
  transition: all 0.2s; font-family: 'Courier New', monospace;
  position: relative; white-space: nowrap;
}
.mod-pill.active { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: bold; }
.mod-pill.done::after {
  content: '✓'; position: absolute; top: -5px; right: -5px;
  background: var(--green2); color: white; border-radius: 50%;
  width: 16px; height: 16px; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}

/* ── LAYOUT ─────────────────────────────────────── */
.tab-content { display: none; padding: clamp(14px,3vw,28px) clamp(14px,3vw,28px) 130px; }
.tab-content.active { display: block; }

/* iPad two-column layout for plan tab */
@media (min-width: 768px) {
  .plan-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .plan-grid .full-width { grid-column: 1 / -1; }
}

/* ── MODULE HEADER ──────────────────────────────── */
.mod-phase {
  font-size: var(--fs-xs); letter-spacing: 3px; text-transform: uppercase;
  color: var(--gold); margin-bottom: 5px;
  font-family: 'Courier New', monospace;
}
.mod-title { font-size: var(--fs-2xl); color: var(--text); line-height: 1.25; margin-bottom: 5px; }
.mod-subtitle { font-size: var(--fs-sm); color: var(--text2); margin-bottom: 18px; line-height: 1.6; }

/* ── COMPLETE BTN ───────────────────────────────── */
.complete-btn {
  width: 100%; padding: clamp(12px,2vw,16px);
  border-radius: var(--radius); border: 1px solid var(--gold);
  font-size: var(--fs-sm); cursor: pointer;
  font-family: Georgia, serif; margin-bottom: 14px;
  transition: all 0.2s; background: transparent; color: var(--gold);
  letter-spacing: 1.5px; text-transform: uppercase;
}
.complete-btn.done { background: var(--gold); color: var(--navy); font-weight: bold; }

/* ── SECTIONS ───────────────────────────────────── */
.section { margin-bottom: 12px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.section-hdr {
  padding: clamp(11px,2vw,15px) clamp(14px,2.5vw,20px);
  font-size: var(--fs-xs); letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  background: var(--navy2); color: var(--gold);
  font-family: 'Courier New', monospace; user-select: none;
}
.section-body {
  padding: clamp(14px,2.5vw,22px);
  background: var(--navy3); border-top: 1px solid var(--border);
}
.section-body.hidden { display: none; }

.obj-text { font-size: var(--fs-base); line-height: 1.75; color: var(--text); }
.topic-item { display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-top: 8px; flex-shrink: 0; }
.topic-text { font-size: var(--fs-sm); color: var(--text); line-height: 1.65; }
.activity-text { font-size: var(--fs-sm); color: var(--text); line-height: 1.75; }

.scenario-box {
  background: var(--redfaint); border: 1px solid var(--red2);
  border-radius: var(--radius); padding: clamp(12px,2vw,18px); margin-bottom: 12px;
}
.scenario-label {
  font-size: var(--fs-xs); letter-spacing: 2px; text-transform: uppercase;
  color: var(--red2); margin-bottom: 8px; font-family: 'Courier New', monospace;
}
.scenario-text { font-size: var(--fs-sm); color: var(--text); line-height: 1.7; font-style: italic; }

.review-box {
  background: var(--goldfaint); border: 1px solid var(--gold);
  border-radius: var(--radius); padding: clamp(12px,2vw,18px);
}
.review-label {
  font-size: var(--fs-xs); letter-spacing: 2px; text-transform: uppercase;
  color: var(--gold); margin-bottom: 8px; font-family: 'Courier New', monospace;
}
.review-text { font-size: var(--fs-sm); color: var(--text); line-height: 1.7; font-style: italic; }

/* ── QUIZ ───────────────────────────────────────── */
.quiz-wrap { max-width: 720px; }
.quiz-q-num {
  font-size: var(--fs-xs); letter-spacing: 2px; text-transform: uppercase;
  color: var(--text3); margin-bottom: 8px; font-family: 'Courier New', monospace;
}
.quiz-q { font-size: var(--fs-md); color: var(--text); margin-bottom: 16px; line-height: 1.65; font-weight: normal; }
.quiz-scenario {
  font-size: var(--fs-sm); color: var(--gold2); margin-bottom: 14px; line-height: 1.65;
  font-style: italic; padding: clamp(10px,2vw,16px);
  background: var(--goldfaint); border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.quiz-opts { display: flex; flex-direction: column; gap: 10px; }

@media (min-width: 768px) {
  .quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}

.quiz-opt {
  display: block; width: 100%; text-align: left;
  padding: clamp(12px,2vw,16px) clamp(14px,2.5vw,20px);
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--navy2); font-size: var(--fs-sm);
  cursor: pointer; font-family: Georgia, serif; transition: all 0.2s;
  color: var(--text); line-height: 1.5;
}
.quiz-opt:disabled { cursor: default; }
.quiz-opt.correct { background: var(--greenfaint); border-color: var(--green2); color: #a8e8b8; }
.quiz-opt.wrong   { background: var(--redfaint);   border-color: var(--red2);   color: #e8a8a8; }
.quiz-opt.reveal  { background: var(--greenfaint); border-color: var(--green2); opacity: 0.55; }

.quiz-exp {
  background: var(--navy); border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: clamp(12px,2vw,18px); margin-top: 8px;
  font-size: var(--fs-sm); line-height: 1.75; color: var(--text2);
}
.quiz-poh {
  font-size: var(--fs-xs); color: var(--gold); margin-top: 8px;
  font-family: 'Courier New', monospace;
}
.quiz-nav {
  display: flex; justify-content: space-between; align-items: center; margin-top: 20px;
}
.quiz-nav button {
  background: var(--navy2); color: var(--gold); border: 1px solid var(--gold);
  border-radius: var(--radius); padding: clamp(10px,1.8vw,14px) clamp(18px,3vw,28px);
  font-size: var(--fs-sm); cursor: pointer; font-family: 'Courier New', monospace; transition: all 0.2s;
}
.quiz-nav button:hover { background: var(--gold); color: var(--navy); }
.quiz-nav button:disabled { background: var(--navy); color: var(--text3); border-color: var(--border); cursor: not-allowed; }
.quiz-nav .score-label { font-size: var(--fs-sm); color: var(--text2); font-family: 'Courier New', monospace; }

.quiz-score { text-align: center; padding: clamp(24px,5vw,50px) 20px; }
.quiz-score .score-num { font-size: clamp(3rem,8vw,5rem); color: var(--gold2); font-family: 'Courier New', monospace; }
.quiz-score p { font-size: var(--fs-md); color: var(--text2); margin-top: 12px; line-height: 1.65; }
.quiz-restart {
  margin-top: 18px; background: var(--gold); color: var(--navy);
  border: none; border-radius: var(--radius);
  padding: clamp(11px,2vw,15px) clamp(24px,4vw,36px);
  font-size: var(--fs-md); cursor: pointer; font-family: Georgia, serif; font-weight: bold;
}
.finish-btn {
  display: block; width: 100%; margin-top: 14px;
  background: var(--gold); color: var(--navy); border: none;
  border-radius: var(--radius); padding: clamp(12px,2vw,16px);
  font-size: var(--fs-md); cursor: pointer; font-family: Georgia, serif; font-weight: bold;
}

/* ── CHEAT SHEET ────────────────────────────────── */
@media (min-width: 768px) {
  .cs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cs-grid .cs-full { grid-column: 1 / -1; }
}

.cs-section { margin-bottom: 14px; }
.cs-title {
  font-size: var(--fs-xs); letter-spacing: 2px; text-transform: uppercase;
  font-family: 'Courier New', monospace; padding: clamp(9px,1.5vw,13px) clamp(14px,2.5vw,20px);
  background: var(--navy2); color: var(--gold);
  border-radius: var(--radius) var(--radius) 0 0;
  border: 1px solid var(--border); border-bottom: none;
}
.cs-body {
  background: var(--navy3); border: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: clamp(12px,2vw,18px);
}
.cs-row {
  display: flex; gap: 12px; margin-bottom: 9px;
  font-size: var(--fs-sm); line-height: 1.55;
  font-family: 'Courier New', monospace;
}
.cs-key { color: var(--gold); min-width: clamp(90px,15vw,130px); flex-shrink: 0; font-weight: bold; }
.cs-val { color: var(--text); }
.cs-warn { color: #e88080; }
.cs-green { color: #7dca9a; }

/* ── BOTTOM NAV ─────────────────────────────────── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: linear-gradient(135deg, #060d14 0%, #0d1b2a 100%);
  display: flex; justify-content: space-between; align-items: center;
  padding: clamp(10px,2vw,16px) clamp(14px,3vw,28px);
  border-top: 1px solid var(--gold); z-index: 100;
}
.bottom-nav button {
  background: var(--navy2); color: var(--gold); border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: clamp(10px,1.8vw,14px) clamp(18px,3vw,28px);
  font-size: var(--fs-sm); cursor: pointer;
  font-family: 'Courier New', monospace; transition: all 0.2s;
}
.bottom-nav button:hover { background: var(--gold); color: var(--navy); }
.bottom-nav button:disabled { background: var(--navy); color: var(--text3); border-color: var(--border); cursor: not-allowed; }
.bottom-nav .counter { font-size: var(--fs-sm); color: var(--text2); font-family: 'Courier New', monospace; }

footer {
  padding: 14px clamp(14px,3vw,28px) 110px;
  font-size: var(--fs-xs); color: var(--text3); text-align: center;
  line-height: 1.7; font-family: 'Courier New', monospace;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<header>
  <div class="hdr-sub">ZU-IZU · Bushbaby Xplorer · KFA 912 ULS-ST · 135HP · Tailwheel</div>
  <div class="hdr-title">Bush Pilot Training Programme</div>
  <div class="hdr-reg">SN: 025-D-23 EXUL · FAHT Hoedspruit · Maseke Game Reserve</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('plan')">📋 Plan</div>
  <div class="tab" onclick="showTab('quiz')">🎯 Quiz</div>
  <div class="tab" onclick="showTab('cheatsheet')">⚡ Quick Ref</div>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span id="phase-label">Phase 2 — Mobile Modules</span>
    <span id="mod-counter">Module A · 0 completed</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:8%"></div></div>
</div>

<div class="mod-picker" id="mod-picker"></div>

<div class="tab-content active" id="tab-plan"><div id="plan-content"></div></div>
<div class="tab-content" id="tab-quiz"><div id="quiz-content"></div></div>
<div class="tab-content" id="tab-cheatsheet"><div id="cheatsheet-content"></div></div>

<div class="bottom-nav">
  <button id="btn-prev" onclick="go(-1)">← Prev</button>
  <span class="counter" id="nav-counter">1 / 12</span>
  <button id="btn-next" onclick="go(1)">Next →</button>
</div>

<script>
const modules = [
  {
    id:'A', phase:'Phase 2 — Mobile', title:'General Rules & Operating Limits',
    subtitle:'Everything that governs how ZU-IZU is legally and safely operated. These are the non-negotiables.',
    objective:'Know the operating envelope of ZU-IZU cold. These limits exist because someone already tested what happens when you exceed them.',
    topics:[
      'MTOW: 600 kg · Empty: 385 kg · Useful load: 215 kg · Baggage max: 30 kg (C of G limit)',
      'VNE: 113 kts — Never Exceed. Structural failure territory above this.',
      'VNO: 100 kts — Max structural cruise. Only exceed in smooth air with caution.',
      'VA: 84 kts — Manoeuvring speed. No full control deflection above this.',
      'Load factors: Flaps UP +4G / -2G · Flaps DOWN +2G · No aerobatics · No intentional spins.',
      'Max bank angle: 60°. Day and night VMC only.',
      'Crosswind demonstrated: 20 kts. Recommended for average pilot: 15 kts.',
      'No transponder fitted on ZU-IZU. No carb heat — KFA 912 ULS-ST is turbocharged.',
      'Fuel: Mogas 95 or Avgas 100LL. Avgas changes maintenance intervals — consult POH.',
      'Starter: Max 20 sec continuous cranking. 1 min cooling before retry.',
      'Airframe major inspection: 1000 hr / 20 years / 8000 landings — whichever first.',
    ],
    activity:'📖 Read all limits. Then cover the screen and write them from memory. Focus on speeds — they will be quizzed. Understand WHY each limit exists.',
    scenario:'You are in a 45° banked turn at 90 kts over Maseke when you enter unexpected turbulence from the escarpment.',
    reviewQ:'What is your margin to VA? What should you do and why? Then state VNE, VNO, VA, VS and VX from memory.',
    quiz:[
      { scenario:'You are climbing at 95 kts when you enter unexpected turbulence over the escarpment west of Maseke.', q:'What is the correct action regarding airspeed?', opts:['Maintain 95 kts — below VNO so fine','Reduce to 85 kts — POH turbulent air penetration speed','Accelerate to VNE for control authority','Reduce to VX 47 kts immediately'], correct:1, exp:'POH Ch4 states turbulent air penetration speed is 85 kts. At 95 kts approaching VNO in turbulence risks structural stress. Reduce smoothly — do not yank the controls.', poh:'POH Ch4: Turbulent air penetration 85 kts' },
      { scenario:null, q:'What does the POH recommend as the crosswind limit for the average pilot?', opts:['20 kts — demonstrated figure applies to all','15 kts','10 kts','No stated recommendation'], correct:1, exp:'POH Ch2 and Ch4: demonstrated crosswind 20 kts. The POH specifically recommends average pilots do not exceed 15 kts. At FAHT with FAHS traffic nearby, conservative crosswind limits are prudent.', poh:'POH Ch2 §2.1 and Ch4' },
      { scenario:'Loading at Maseke: Pilot 85 kg, observer 90 kg, equipment 20 kg, fuel 80L (57.6 kg). Aircraft empty weight 385 kg.', q:'Are you within MTOW limits?', opts:['Yes — MTOW 600 kg so plenty of room','No — 385+85+90+20+57.6 = 637.6 kg. Over MTOW by 37.6 kg.','Yes — fuel is not counted in useful load','Cannot determine without W&B sheet'], correct:1, exp:'385 + 85 + 90 + 20 + 57.6 = 637.6 kg. Exceeds MTOW 600 kg by 37.6 kg. Reduce fuel or payload. At Maseke in hot conditions this is a real daily calculation.', poh:'POH Ch6: MTOW 600 kg' },
    ]
  },
  {
    id:'B', phase:'Phase 2 — Mobile', title:'Fuel System Mastery',
    subtitle:'The most operationally critical system on ZU-IZU. Own it completely.',
    objective:'Understand every component, valve, and warning — and manage a fuel emergency from memory under stress.',
    topics:[
      'Wing tanks: 50L each (100L total usable in level flight). Unusable: 400ml header + 2.5L per wing.',
      'Header tank: 5L mounted low aft of firewall. Buffer for low fuel / nose-low / sideslip attitudes.',
      'Fuel feed: Gravity → header tank → mechanical pump → backup electric pump.',
      'Selector logic: ONE closed on ground. BOTH open for T/O, landing, all manoeuvring except level cruise.',
      'CRITICAL: Both tanks OPEN before any sideslip. Low fuel + nose-low + single tank = starvation risk.',
      'Header tank warning light: ~500ml air in header. ~8 min at cruise power from warning to engine stop.',
      'Immediate actions: Level wings → reduce power → check all valves open → select fullest tank.',
      'Fuel sample: Below header tank, right side of cowling — lowest point in system. Every flight.',
      'Fuel quantity: Visual sighting from cockpit via LED lights. Aircraft must be level for accuracy.',
      'Long cruise management: Alternate tanks every 30 min. Ball centred — unbalanced causes fuel imbalance.',
      'Fuel burn (KFA 912 ULS-ST): 16-25 L/hr at 80-100 kts. Endurance 5 hrs at 20 L/hr no reserve.',
      'Emergency shut-off valve: Above flap handle on centre console. Only close for suspected engine fire or maintenance.',
    ],
    activity:'🧠 Trace the entire fuel path from wing tank to engine in your mind. Drill the 8-min header tank warning action from memory — say it out loud.',
    scenario:'You are 40 min into a surveillance flight at 500ft AGL over Maseke. Header tank warning light illuminates. You were flying ball-right for 15 min with only the right tank open.',
    reviewQ:'Walk through the complete fuel emergency from the moment the light illuminates. What caused it? Immediate actions in order? Time margin?',
    quiz:[
      { scenario:'Header tank warning light illuminates at 500ft AGL over Maseke bush.', q:'What is your immediate first action?', opts:['Declare MAYDAY immediately','Level the wings and reduce power','Land immediately regardless of terrain','Switch off master to preserve battery'], correct:1, exp:'Level wings first — banked attitude with low fuel accelerates starvation. Then reduce power to extend time. POH: ~8 min from light to engine stop at cruise power. Reducing power significantly extends this margin.', poh:'POH Ch1: Header tank warning — immediate actions' },
      { scenario:null, q:'You are about to sideslip on final at a bush strip. What must you do to the fuel selectors first?', opts:['Close right tank to prevent overflow','Both tanks must be OPEN before any sideslip','Makes no difference during a sideslip','Close both — gravity feed is sufficient for a short approach'], correct:1, exp:'POH is explicit: select both fuel tank selectors ON before side-slipping. Sideslip combined with low fuel and single open tank risks uncovering the fuel outlet — causing starvation even with fuel still aboard.', poh:'POH Ch4: Approach — both tanks OPEN before sideslip' },
      { scenario:'Parked at Maseke on a nose-high slope after 2 hrs flying. Both tanks were open in flight.', q:'What do you do with the fuel selectors on shutdown?', opts:['Leave both open — they were open in flight','Close one valve — slope parking with both open risks fuel flowing from higher tank and spilling through vent pipe','Close both immediately','Makes no difference on shutdown'], correct:1, exp:'POH Ch4 shutdown: when parked on a slope, close one tank valve. Prevents fuel from higher tank flowing to lower and spilling through the vent pipe — which can damage the fabric.', poh:'POH Ch4: Shutdown — fuel valve management on slope' },
    ]
  },
  {
    id:'C', phase:'Phase 2 — Mobile', title:'Mnemonic Mastery',
    subtitle:'All ZU-IZU mnemonics cold. No notes. Timed. These are your mental checklists under stress.',
    objective:'Every checklist mnemonic must be instantly retrievable. Drill until automatic.',
    topics:[
      'RUN-UP: T-T-T-T · M · P-P · G · F-F · I · H · E',
      'T — Trim set for take-off',
      'T — Throttle friction set',
      'T — Test controls full and free',
      'T — Temperatures in green (oil temp ≥50°C)',
      'M — Magnetos check 4000 RPM (max drop 300, diff 150)',
      'P — Pressure: oil pressure normal',
      'P — Pitot / instruments check',

      { scenario:null, q:'HASEL — what does L stand for and why is it critical at FAHT?', opts:['Levers — all controls free','Location — landmarks, landing field, look out for traffic','Limits — confirm flight envelope','Level — wings level before manoeuvre'], correct:1, exp:'L = Location. Know a landmark, see a landing field, scan 180° for traffic. At FAHT this is critical because FAHS military airspace is immediately adjacent. Know exactly where you are before any upper air work.', poh:'POH Ch9: HASEL' },

  {

      'ENGINE FIRE IN FLIGHT: Mags OFF · Emergency fuel shut-off CLOSED · Fuel selectors CLOSED · Power OFF · Emergency descent · Sideslip fire away from cockpit.',

    activity:'🚨 Drill all tiers verbatim. Cover screen. Recite each tier three times from memory. Then close your eyes — talk through an engine fire in flight from the moment you smell smoke.',
    scenario:'Departing FAHT runway. At 150ft AGL the engine loses power significantly but does not stop. Scrub ahead. Runway behind you.',
    reviewQ:'Talk through exact actions. Priority? Do you attempt to return to runway? Why or why not? Target speed?',
    quiz:[
      { scenario:'Engine failure immediately after take-off from FAHT. 200ft AGL. Runway behind. Bush ahead.', q:'Your first action:', opts:['Attempt turnback to runway','Close power, lower nose, land ahead, keep flying the airplane','Declare MAYDAY on 121.5','Climb steeply for restart altitude'], correct:1, exp:'Fly the aircraft. Close power, lower nose, land ahead. The turnback at low altitude is one of the most statistically lethal decisions in aviation. At 200ft you do not have altitude to turn back. POH: Do not attempt to turn back to the field.', poh:'POH Ch3: Engine Failure After Takeoff' },
      { scenario:'3000ft over Maseke. You smell fuel and see smoke from the engine compartment.', q:'Correct sequence for engine fire in flight:', opts:['Land immediately without touching anything','Mags OFF · Shut-off CLOSED · Selectors CLOSED · Power OFF · Emergency descent · Sideslip fire away from cockpit','Fuel selectors CLOSED first · then mags · then descend','Pull parachute handle immediately'], correct:1, exp:'POH Ch3 fire procedure in this exact order. The sideslip is critical — use it to draft fire away from the cockpit. Parachute is last resort. Attempt engine fire procedure first.', poh:'POH Ch3: Engine Fire In Flight' },
      { scenario:'On final at Maseke, fully configured, trimmed full nose-up. Unstable approach — you go around.', q:'What specific hazard must you anticipate the moment you apply full power?', opts:['Propeller torque yaws right only','Full nose-up trim + full power = strong nose-up pitch tendency — push stick forward immediately while applying right rudder','Flaps retract automatically at full power','No specific hazard — apply full power normally'], correct:1, exp:'POH Ch3 and Ch4 specifically warn: full nose-up trim on landing + full power on go-around = nose-up pitching moment. Push stick forward as required and trim nose-down while climbing out. At low altitude this can be fatal if not anticipated.', poh:'POH Ch3: Go-Around WARNING' },

    activity:'🎙 Speak every call out loud — never in your head. Do the complete FAHT circuit call sequence in real time. Then Maseke blind call ×5 until automatic. Record yourself.',
    scenario:'Inbound to FAHT from Maseke, 2500ft. A helicopter is working the circuit. You have a precautionary fuel state — not an emergency but prefer to land soon.',
    reviewQ:'Write and speak the exact radio calls from first AFIS contact to landing. How do you communicate fuel preference without declaring a full emergency?',
    quiz:[
      { scenario:null, q:'Departing FAHT runway 05, tracking north-east to Maseke, climbing 2500ft. What is your departure call?', opts:['"ZU-IZU, departure."','"Hoedspruit AFIS, ZU-IZU, departing runway zero five, tracking north-east towards Maseke, climbing two thousand five hundred feet."','"ZU-IZU, taking off runway zero five."','"Hoedspruit AFIS, ZU-IZU, airborne."'], correct:1, exp:'Full departure call: callsign, runway, track/direction, intended altitude. Giving AFIS this information allows traffic information to other aircraft. Brevity is good — not at the expense of essential information.', poh:'SA VFR Radio Procedures — Departure call' },
      { scenario:null, q:'Difference between MAYDAY and PAN-PAN?', opts:['MAYDAY is engine problems only, PAN-PAN for all other emergencies','MAYDAY = grave and imminent danger requiring immediate assistance. PAN-PAN = urgency — serious but not immediately life-threatening.','They are interchangeable — use whichever you remember','PAN-PAN mechanical, MAYDAY medical only'], correct:1, exp:'MAYDAY (French m\'aider — help me): Grave and imminent danger. PAN-PAN (French panne — breakdown): Urgent, serious but not yet life-threatening. Fuel concern with 15+ minutes fuel = PAN-PAN. Engine stopped = MAYDAY.', poh:'ICAO Annex 10 — Emergency communications' },
      { scenario:'Low level over Maseke. Another aircraft calls the Maseke frequency.', q:'What information do you immediately give?', opts:['Callsign only','Callsign, current position, altitude AGL, direction, estimated time on frequency','Switch to FAHT AFIS to deconflict','No call required — they can see you visually'], correct:1, exp:'At low level in bush, situational awareness between aircraft depends entirely on radio calls. Give everything needed for a mental picture: who, where, how high, which direction, how long. Professional bush radio discipline.', poh:'Good Airmanship — Radio in shared airspace' },
    ]

  {
    id:'F', phase:'Phase 2 — Mobile', title:'Weather Minima & Go/No-Go',
    subtitle:'Limpopo weather kills. The thunderstorm does not care about your mission.',
    objective:'Know the legal VFR minima. More importantly know YOUR personal minimums — which are higher. Go/no-go decisions are made on the ground.',
    topics:[
      'Class G VFR minima SA: 1500m visibility · Clear of cloud · 300ft vertical / 1500m horizontal from cloud.',
      'Below 3000ft AMSL or 1000ft AGL in Class G: Clear of cloud and in sight of surface. 1500m vis still applies.',
      'FAHT sits at ~1500ft AMSL. Factor this into cloud base calculations.',
      'Limpopo summer: CB development from midday. Plan to be on ground by 1400 hrs in summer.',
      'Density altitude at FAHT: 35°C afternoon DA can reach 4500ft+. T/O roll increases significantly.',
      'Go/No-Go framework: Legal minima are the floor, not the target. Personal minimums are higher.',
      'Suggested personal minimums for Maseke low-level: 5km+ vis · 2000ft+ AGL cloud base · Wind <15 kts · No Cb 30nm · DA <4000ft.',
      'Get-home-itis: The mission is never worth more than the aircraft and pilot. If in doubt — do not go.',
      'Weather tools: SAWS (weathersa.co.za) · Windy.com (low level) · Meteoblue (terrain) · AFIS for local.',
      'SIGMET awareness: Severe turbulence, CB activity, mountain wave. Check before every flight.',
    ],
    activity:'🌩 Check today\'s weather for FAHT on Windy.com and SAWS. Would ZU-IZU be flying today? Run through the go/no-go decision out loud. Practice making and defending it.',
    scenario:'1330 hrs. Requested surveillance of active poaching at Maseke. Visibility 8km but Cu building rapidly to the west. Wind 12 kts. Passenger insisting the flight must happen now.',
    reviewQ:'What is your go/no-go decision and how do you communicate it? What are you weighing? What is the risk of departing now vs 30 minutes?',
    quiz:[
      { scenario:'1345 hrs January. CB activity developing 25nm west of FAHT. Cloud base 3000ft. Visibility 10km. Wind calm.', q:'Your go/no-go for a 45-minute Maseke surveillance flight:', opts:['Go — visibility and cloud base fine','No-go — CB within 30nm, 1345 departure means return in peak CB window','Go — wind calm so turbulence risk low','Go but plan to return if it gets worse'], correct:1, exp:'CB within 30nm = no-go by professional standards. 45 min departing 1345 = return ~1430 when Limpopo convective activity peaks. "Return if it gets worse" is classic get-home-itis. The decision is made on the ground or not at all.', poh:'Personal Minimums — CB within 30nm' },
      { scenario:'Density altitude at FAHT today is 4300ft. ZU-IZU at MTOW 600kg.', q:'POH states T/O roll 80m at ISA sea level. Your practical expectation:', opts:['80m — POH figure is for all conditions','Significantly longer — DA 4300ft at MTOW means reduced engine output, reduced prop efficiency, reduced lift. Expect 110-130m minimum.','Turbocharger fully compensates for DA','60m — hot air reduces drag'], correct:1, exp:'The turbocharger partially compensates engine output but does NOT compensate aerodynamic efficiency (prop bite, wing lift). At 4300ft DA and MTOW, budget for significantly extended T/O roll. Know your Maseke strip length.', poh:'POH Ch5: Performance data — ISA conditions' },
      { scenario:null, q:'Legal VMC minimum visibility in Class G airspace SA, daytime VFR:', opts:['800m','5km','1500m','3km'], correct:2, exp:'1500m is the legal minimum for VFR in Class G by day in South Africa. This is the floor — not a recommendation. Bush and low-level operations should apply higher personal minimums.', poh:'SA CAA CAR 91 — VFR Meteorological Minima' },
    ]

  {
    id:'G', phase:'Phase 2 — Mobile', title:'Aircraft Systems — Why ZU-IZU Is Built This Way',
    subtitle:'Every design decision on the Bushbaby Xplorer exists for a reason. Understand the why.',
    objective:'Understand ZU-IZU\'s systems at a conceptual level. This turns procedures into understanding.',
    topics:[
      'HIGH WING: Ground clearance for rough strips. Gravity fuel feed — simpler, fewer failure modes. Better downward visibility for surveillance.',
      'FABRIC OVER STEEL TUBE: Lightweight. Field-repairable with basic materials. Steel tube structure is crash-resistant. Fabric damage is visible and obvious.',
      'KFA BUFFALO SUSPENSION: Bungee/Buffalo gear absorbs rough strip landings. Designed for Maseke terrain. Fixed gear — no retraction system to fail.',
      'TAILWHEEL CONFIGURATION: Lower empty weight. Better prop clearance on rough strips. More responsive on unprepared surfaces. Higher pilot skill demand — deliberate choice.',
      'FULL-SPAN FLAPERONS: Combined flap/aileron. Max 12-15° while retaining full aileron control. Efficient. Selecting flap increases aileron sensitivity.',
      'HEADER TANK SYSTEM: Buffer for fuel supply in nose-low, sideslip, and low fuel states. Essential for STOL and bush ops.',
      'KFA 912 ULS-ST TURBOCHARGED: Standard 912 ULS = 100hp. KFA turbocharges to 135hp. Maintains power at altitude. Critical for hot/high Limpopo. No carb ice risk.',
      'E-PROP 4-BLADE 72": Shorter diameter than equivalent 2-blade — better ground clearance. More blades = smoother power delivery. Ground-adjustable for specific ops.',
      'FOLDING WINGS: Transport by trailer. Deploy to Maseke if needed.',
      'VORTEX GENERATORS (VGs): Reduce stall speed. Improve low-speed handling critical for STOL. Do NOT bump — precise angle is everything.',
    ],
    activity:'🔧 Walk around ZU-IZU and identify each system. Touch the fabric, examine the Buffalo suspension, find the header tank, count the VGs. Understanding becomes real when you can point to it.',
    scenario:'A visiting Cessna 172 pilot asks why you chose a tailwheel over nosewheel for Maseke operations.',
    reviewQ:'Give three primary reasons tailwheel is better for Maseke. Then state the one significant disadvantage and how you manage it.',
    quiz:[
      { scenario:null, q:'Why does ZU-IZU use a header tank in addition to two wing tanks?', opts:['Increase total capacity beyond 100L','Buffer for continued fuel supply during nose-low attitudes, sideslips, and very low fuel — without it gravity feed fails in these attitudes','Comply with SACAA bush aircraft regulations','Allow single-tank cruise operation'], correct:1, exp:'Header tank is a safety buffer. Wing-mounted gravity tanks can uncover outlets during nose-low flight, sideslips, or very low fuel. The header ensures continuous supply to engine in these situations — critical for STOL and bush ops.', poh:'POH Ch1: Fuel System description' },
      { scenario:null, q:'KFA 912 ULS-ST produces 135hp vs standard Rotax 912 ULS at 100hp. Primary benefit for Maseke ops:', opts:['Higher cruise speed on long transits','Maintaining performance in hot/high Limpopo — standard 100hp is significantly derated at DA 4000ft+, plus short-field climb at Maseke','Reduced fuel consumption','Better engine cooling in hot weather'], correct:1, exp:'At Maseke in summer (35°C, ~1500ft AMSL = DA often 4000ft+), 100hp is significantly limited. KFA turbocharger maintains closer to sea-level engine output at altitude — meaningful STOL performance that a standard engine cannot provide.', poh:'POH Ch1: KFA 912 ULS-ST specifications' },
      { scenario:null, q:'Why must you never bump the vortex generators (VGs) during cleaning?', opts:['Expensive and difficult to replace','Their precise angle relative to airflow is critical — even small displacement degrades boundary layer energising, potentially raising stall speed and degrading low-speed handling','They contain G3X sensors','They are structural load-bearing components'], correct:1, exp:'VGs create tiny vortices that re-energise boundary layer airflow, delaying stall. Their angle of attack relative to wing chord is precisely set. Bending them — even slightly — degrades effectiveness and can meaningfully increase stall speed. Critical at ZU-IZU\'s STOL operating speeds.', poh:'POH Ch3: Winter Weather — care of vortex generators' },
    ]
  },
  {
    id:'H', phase:'Phase 2 — Mobile', title:'Taildragger & Bush Strip Techniques',
    subtitle:'Filtered specifically for ZU-IZU. 135hp changes what works on lighter taildraggers.',
    objective:'Master techniques specific to ZU-IZU as a tailwheel aircraft in bush environment. Know which generic taildragger advice needs Xplorer modification.',
    topics:[
      'GROUND HANDLING: Stick BACK always with engine running. Rudder + differential braking — drag, do not block. Move forward before turning.',
      'WIND TAXI CORRECTIONS: Headwind — stick BACK, aileron INTO wind. Tailwind — stick FORWARD, aileron AWAY from wind.',
      'TAKE-OFF: Heels to floor. Smooth full power — 5-count before raising tail. Raise tail SLOWLY — abrupt = hard left swerve. Watch runway edges not centreline. More speed = smaller rudder inputs.',
      'THREE-POINT LANDING: Level off 3ft (height of a person). Burn all energy. Fly only the tailwheel. Touchdown tailwheel first or simultaneous. Work stick back. Eyes 10 and 2 o\'clock.',
      'WHEEL LANDING: Main wheels first. Forward stick on touchdown. Reduce power when directional control assured. Tail comes down as speed bleeds.',
      'TAIL-LOW METHOD: Level off 1-2ft with little power. Wait for ground. Contact → stick FORWARD. Do not hold tail up too long. Good for rougher strips and gusty headwind.',
      'CROSSWIND — CRAB METHOD: Crab into wind. Land on upwind main. Stick forward on touchdown. Windward side runway alignment.',
      'GROUNDLOOP PREVENTION — XPLORER SPECIFIC: Rudder → Brake → Throttle (EXTREME CAUTION 135hp — use sparingly or not at all) → Aileron into swerve.',
      'MASEKE STRIP: Build progressively. Power lines on final — red balls — steeper approach. Power lines departure end — VX 47 kts critical. Not a Day 1 strip.',
      'BUSH STRIP ASSESSMENT — SUITABL: Surface · Undershoot · Into wind · Touchdown point · Adequate length · Barriers · Landing direction.',
      'APPROACH SPEEDS: 60 kts @ 5° flap normal. 50-55 kts @ 8-12° over the fence. Glide: 65-67 kts. Sideslip adds 500-700 fpm.',
    ],
    activity:'✏️ Without looking, describe your full Maseke approach from 5nm to stopped. Speeds, flap settings, radio calls, strip assessment criteria. Then compare to this module.',
    scenario:'Final at Maseke. High and fast — 70 kts at 200ft with 5° flap. Power lines ahead marked with red balls. Go-around possible but tight.',
    reviewQ:'Go-around or land? If landing — which technique? Specific risks? If going around — procedure and minimum altitude needed?',
    quiz:[
      { scenario:'Take-off roll at Maseke. Aircraft begins swinging left at approximately 30 kts.', q:'Correct response in order:', opts:['Full left aileron, power off, right brake','Right rudder first, right brake if needed, extreme caution with throttle (135hp), aileron into swerve','Close throttle immediately, steer with brakes only','Continue — swing will self-correct as speed increases'], correct:1, exp:'Groundloop prevention on ZU-IZU: Rudder first, brake second. Throttle with EXTREME caution — 135hp is powerful enough to reinforce the swing. Aileron into swerve last. At 30 kts you have rudder authority — use it.', poh:'Tailwheel Notes: Groundloop prevention — Xplorer specific' },
      { scenario:null, q:'SUITABL assessment — what does B stand for?', opts:['Brakes — test before approach','Barriers — obstacles in approach and departure paths','Base leg — check before turning final','Boundary — confirm strip boundary clear'], correct:1, exp:'SUITABL: Surface · Undershoot · Into wind · Touchdown point · Adequate length · Barriers · Landing direction. Barriers covers all obstacles — trees, power lines, fences, terrain — in approach and departure paths. At Maseke the power lines at both ends are exactly what SUITABL is designed to catch.', poh:'Bush strip assessment framework' },
      { scenario:null, q:'On a wheel landing at Maseke the aircraft bounces. Immediate correct action:', opts:['Hold back stick firmly to prevent nose drop','Apply brakes immediately','Go-around — full power, raise flap at positive rate of climb','Reduce power and let bounce settle'], correct:2, exp:'Bounced landing = go-around. A bounce means the energy is wrong. Adding full power and going around is always safer than attempting to re-land from an unstable attitude. Note: anticipate nose-up pitch tendency at full power if trimmed nose-up.', poh:'Tailwheel Notes: Wheel landing — bounced: go-around' },
    ]
  },
  {
    id:'I', phase:'Phase 2 — Mobile', title:'Aviation You Tend To Forget',
    subtitle:'The subtle killers. The things that do not announce themselves.',
    objective:'Refresh the human factors, physiological, and aerodynamic awareness topics that atrophy without regular flying.',
    topics:[
      'SPATIAL DISORIENTATION: The vestibular system lies in cloud. The leans. Graveyard spiral. Trust the G3X attitude indicator. Never trust your seat of your pants in low vis.',
      'HYPOXIA: Service ceiling 12,000ft. Symptoms: euphoria, confusion, tingling. Insidious. O2 recommended above 10,000ft.',
      'WAKE TURBULENCE: Avoid behind and below heavy aircraft. Vortices sink and drift downwind. FAHS commercial traffic awareness at FAHT.',
      'VISUAL ILLUSIONS: Narrow runway = feels high → land short. Wide runway = feels low → overshoot. Upslope = feels high → land short. Downslope = feels low → overshoot.',
      'RUNWAY ILLUSIONS AT MASEKE: Short strips, narrow, tree-lined. Trust your approach speed — not your visual impression.',
      'FATIGUE: Kills slowly. Decision-making degrades first — before you notice it. Then vigilance. Motor skills last. Fatigued = do not fly.',
      'STALL AWARENESS: Any speed, any attitude. In a 60° bank VS × 1.41. In 45° bank VS × 1.19. ZU-IZU buffets ~5 kts before stall.',
      'NO CARB ICE ON ZU-IZU: KFA 912 ULS-ST is turbocharged. No carburettor, no carb ice, no carb heat. It does not exist on this aircraft.',
      'DENSITY ALTITUDE: Performance altitude. High DA = longer T/O, reduced ROC, higher true airspeed at same IAS. Compute before every Maseke summer departure.',
      'LOSS OF CONTROL: Leading cause of fatal GA accidents. Low level + in a turn + distracted = fatal combination. The Killing Zone documents this.',
    ],
    activity:'🧠 Read "The Killing Zone" chapter on LOC accidents in the 50-500hr band. Then honestly assess: which of those biases apply to your operation at Maseke?',
    scenario:'3 hrs surveillance in hot conditions. Difficult passenger. One more transect requested. Light is perfect. The temptation is strong.',
    reviewQ:'Your decision and the factors driving it. What does fatigue do to pilot performance specifically? What would a professional test pilot do?',
    quiz:[
      { scenario:'45° bank turn at 60 kts over Maseke at 300ft AGL. Distracted by something on the ground.', q:'Stall speed in this configuration and your margin:', opts:['38 kts — same as wings-level','Approximately 45 kts (VS × 1.19). At 60 kts your margin is only 15 kts — at 300ft AGL.','35 kts — flaps increase margin in turns','45 kts — bank angle has minimal effect'], correct:1, exp:'45° bank = load factor 1.41G = stall speed VS × √1.41 = 38 × 1.19 ≈ 45 kts. At 300ft AGL with 15 kts margin and an active distraction — this is exactly how fatal accidents happen. POH: average height loss during stall testing 0-300ft.', poh:'POH Ch2: Stall behaviour — height loss 0-300ft' },
      { scenario:null, q:'You feel buffet in a climbing turn. Immediate action:', opts:['Hold attitude and add power to fly through','Reduce angle of attack by releasing back pressure, level wings with rudder, regain airspeed, retract flap as speed increases','Push nose sharply down more than 30°','Apply full aileron to level wings'], correct:1, exp:'POH Ch2: Reduce angle of attack first — release back pressure. Level wings with RUDDER not aileron (aileron increases AoA on lowered wing). Regain airspeed. Retract flap as speed increases. Do not push more than 30° — usually 5-20° sufficient.', poh:'POH Ch2: Stall behaviour and recovery' },
      { scenario:null, q:'Fatigue research tells you about your own in-flight self-assessment:', opts:['If you feel fine you are fine — trust self-assessment','Fatigue impairs self-assessment ability. Fatigued pilots consistently rate performance better than actual. Decision-making is first faculty to degrade.','One more pass is manageable with experience','Coffee restores performance adequately'], correct:1, exp:'Aviation fatigue research: fatigued individuals are poor judges of own fatigue. Decision-making degrades before vigilance and motor skills — you will make a bad decision while feeling capable. Pre-determined fatigue limits beat in-the-moment self-assessment every time.', poh:'Good Airmanship — Fatigue and self-assessment' },
    ]
  },
  {
    id:'J', phase:'Phase 2 — Mobile', title:'Good Airmanship & Decision Making',
    subtitle:'The things that separate pilots who last from pilots who do not.',
    objective:'Internalise the decision-making frameworks professionals use. These cannot be memorised — they must be understood until they become instinct.',
    topics:[
      'THREAT & ERROR MANAGEMENT (TEM): Identify threats before errors. Errors before incidents. Three lines: avoid → trap → mitigate.',
      'GET-HOME-ITIS: The silent killer. Mission pressure, passenger expectations, sunk cost. The aircraft does not know how important the mission is.',
      'PERSONAL MINIMUMS: Set them before you need them. Write them down. Never renegotiate in the air. Visibility, cloud base, wind, DA, fuel — decide on the ground.',
      'STERILE COCKPIT: Below 500ft AGL — no non-essential communication. No passenger questions. No radio chat. Full attention to flying. Enforce it professionally.',
      'POST-FLIGHT DEBRIEF: After every flight — 3 sentences. What went well. What I would do differently. One thing to drill before next flight.',
      'CONTINUE-OR-TURN-BACK: Make this decision at a defined point before departure. If X happens, I turn back. Stick to it.',
      'PASSENGER MANAGEMENT: Brief them fully. Manage expectations. Never let a passenger influence a safety decision.',
      'LOW LEVEL MINDSET: Every low level flight demands higher currency. Faster decisions, less time for error recovery, terrain rises to meet you.',
      'STICK AND RUDDER: Understand what the aircraft is actually doing aerodynamically. Langewiesche. A pilot who understands can adapt to any situation.',
      'THE KILLING ZONE: 50-350 hr pilots have the highest accident rate. Overconfidence + fading training + increasing complexity. Know which phase you are in.',
      'FUEL DISCIPLINE: Land with a defined minimum — 20L. Non-negotiable. Plan it before departure. Never renegotiate because the mission ran long.',
    ],
    activity:'📖 Write your 3-sentence post-flight debrief for the last flight you can clearly remember. Start the habit today — every flight from now on.',
    scenario:'30 min into Maseke surveillance. Weather deteriorated — 4km visibility and dropping. Cloud base 1500ft. 20nm from FAHT. Ranger asking for another 20 min.',

let current = 0;
let completed = [];
try { completed = JSON.parse(localStorage.getItem('zuizu_v2') || '[]'); } catch(e){}
let quizStates = {};
let openSections = {};
let activeTab = 'plan';

function save() { try { localStorage.setItem('zuizu_v2', JSON.stringify(completed)); } catch(e){} }

function showTab(t) {
  activeTab = t;
  ['plan','quiz','cheatsheet'].forEach((n,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', n === t);
    document.getElementById('tab-'+n).classList.toggle('active', n === t);
  });
  if (t === 'cheatsheet') renderCS();
  if (t === 'quiz') renderQuiz();
}

function buildPicker() {
  const p = document.getElementById('mod-picker');
  p.innerHTML = '';
  modules.forEach((m,i) => {
    const done = completed.includes(m.id);
    const el = document.createElement('div');
    el.className = 'mod-pill' + (i===current?' active':'') + (done?' done':'');
    el.textContent = 'Mod '+m.id;
    el.onclick = () => { current=i; render(); };
    p.appendChild(el);
  });
  const a = p.querySelector('.active');
  if(a) a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function updateMeta() {
  const m = modules[current];
  const pct = Math.max(8,(current+1)/modules.length*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('phase-label').textContent = m.phase;
  document.getElementById('mod-counter').textContent = 'Module '+m.id+' · '+completed.length+' completed';
  document.getElementById('nav-counter').textContent = (current+1)+' / '+modules.length;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===modules.length-1;
}

function toggle(id) {
  openSections[id] = !openSections[id];
  const b = document.getElementById('sb-'+id);
  const a = document.getElementById('sa-'+id);
  if(b) b.classList.toggle('hidden',!openSections[id]);
  if(a) a.textContent = openSections[id]?'▲':'▼';
}

function sec(key,label,html,def=true) {
  const id=key+'_'+current;
  if(openSections[id]===undefined) openSections[id]=def;
  const o=openSections[id];
  return `<div class="section">
    <div class="section-hdr" onclick="toggle('${id}')">${label}<span id="sa-${id}">${o?'▲':'▼'}</span></div>
    <div class="section-body ${o?'':'hidden'}" id="sb-${id}">${html}</div>
  </div>`;
}

function toggleDone(id) {
  const i=completed.indexOf(id);
  if(i===-1) completed.push(id); else completed.splice(i,1);
  save(); render();
}

function render() {
  const m=modules[current];
  const done=completed.includes(m.id);

  const topics = m.topics.map(t=>`<div class="topic-item"><div class="dot"></div><div class="topic-text">${t}</div></div>`).join('');
  const scen = `<div class="scenario-box"><div class="scenario-label">⚠ Scenario</div><div class="scenario-text">${m.scenario}</div></div>`;
  const rev  = `<div class="review-box"><div class="review-label">Review Question</div><div class="review-text">${m.reviewQ}</div></div>`;

  document.getElementById('plan-content').innerHTML = `
    <div class="mod-phase">${m.phase} · Module ${m.id}</div>
    <div class="mod-title">${m.title}</div>
    <div class="mod-subtitle">${m.subtitle}</div>
    <button class="complete-btn ${done?'done':''}" onclick="toggleDone('${m.id}')">${done?'✓ Module Complete':'Mark as Complete'}</button>
    <div class="plan-grid">
      <div class="full-width">${sec('obj','Objective',`<p class="obj-text">${m.objective}</p>`)}</div>
      <div class="full-width">${sec('topics','Core Content',topics)}</div>
      <div>${sec('activity',"Today's Activity",`<div class="activity-text">${m.activity}</div>`,false)}</div>
      <div>${sec('scen','Scenario & Review Question',scen+rev,false)}</div>
    </div>`;

  updateMeta(); buildPicker();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuiz() {
  const m=modules[current];
  if(!quizStates[current]) quizStates[current]={q:0,score:0,ans:[],done:false};
  const s=quizStates[current];
  const el=document.getElementById('quiz-content');

  if(s.done){
    el.innerHTML=`
      <div class="mod-phase">Module ${m.id} · Results</div>
      <div class="mod-title" style="margin-bottom:8px">${m.title}</div>
      <div class="quiz-score">
        <div class="score-num">${s.score}/${m.quiz.length}</div>
        <p>${s.score===m.quiz.length?'🎯 Perfect. Drill complete.':s.score>=2?'✓ Good — review surprising explanations.':'Review module content and retry.'}</p>
        <button class="quiz-restart" onclick="restartQ()">Restart Quiz</button>
      </div>`;
    return;
  }

  const q=m.quiz[s.q];
  const ans=s.ans[s.q];
  const scen=q.scenario?`<div class="quiz-scenario">📍 ${q.scenario}</div>`:'';
  const opts=q.opts.map((o,i)=>{
    let cls='quiz-opt'; let dis='';
    if(ans!==undefined){
      dis='disabled';
      if(i===q.correct) cls+=ans===i?' correct':' reveal';
      else if(i===ans) cls+=' wrong';
    }
    return `<button class="${cls}" ${dis} onclick="ansQ(${i})">${o}</button>`;
  }).join('');
  const exp=ans!==undefined?`<div class="quiz-exp">${q.exp}<div class="quiz-poh">📖 ${q.poh}</div></div>`:'';

  el.innerHTML=`
    <div class="mod-phase">Module ${m.id} · Quiz</div>
    <div class="mod-title" style="font-size:var(--fs-lg);margin-bottom:14px">${m.title}</div>
    <div class="quiz-wrap">
      <div class="quiz-q-num">Question ${s.q+1} of ${m.quiz.length}</div>
      ${scen}
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">${opts}</div>
      ${exp}
      <div class="quiz-nav">
        <button onclick="qNav(-1)" ${s.q===0?'disabled':''}>← Back</button>
        <span class="score-label">${s.score} correct</span>
        <button onclick="qNav(1)" ${ans===undefined||s.q===m.quiz.length-1?'disabled':''}>Next →</button>
      </div>
      ${ans!==undefined&&s.q===m.quiz.length-1?`<button class="finish-btn" onclick="finQ()">See Results</button>`:''}
    </div>`;
}

function ansQ(i){
  const s=quizStates[current];
  if(s.ans[s.q]!==undefined) return;
  s.ans[s.q]=i;
  if(i===modules[current].quiz[s.q].correct) s.score++;
  renderQuiz();
}
function qNav(d){ quizStates[current].q=Math.max(0,quizStates[current].q+d); renderQuiz(); }
function finQ(){ quizStates[current].done=true; renderQuiz(); }
function restartQ(){ quizStates[current]={q:0,score:0,ans:[],done:false}; renderQuiz(); }
